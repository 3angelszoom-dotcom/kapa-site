  async function stop(f) {
    if (!confirm(f.flight + ' 공유를 끝낼까요?')) return;
    try { data = await call('stopFlight', key, f.id); draw(); } catch (e) { if (e.message !== '__auth') $('msg').textContent = e.message; }
  }
  const pad = n => String(n).padStart(2, '0'), today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  function openShare() {
    if (!key) { showLogin(); return; }
    const inp = (ph, lab, max) => el('input', { placeholder: ph, 'aria-label': lab, maxlength: max, autocapitalize: 'characters', autocomplete: 'off', spellcheck: 'false' });
    const fl = inp('예: UA111', '편명', 8), cs = inp('예: SKW5432', 'ATC 콜사인', 8), fr = inp('SFO', '출발 공항', 4), to = inp('ORD', '도착 공항', 4);
    const dt = el('input', { type: 'date', 'aria-label': '날짜' }); dt.value = today(); dt.min = today();
    const err = el('p', { class: 'err' }), ok = el('button', { type: 'button', class: 'ok' }, '공유하기');
    const close = () => ov.remove();
    const send = async () => {
      if (!fl.value.trim()) { err.textContent = '편명을 넣어 주세요.'; return; }
      if (!dt.value) { err.textContent = '날짜를 골라 주세요.'; return; }
      const [y, m, d] = dt.value.split('-').map(Number);
      ok.disabled = true; err.textContent = '';
      try { data = await call('shareFlight', key, { flight: fl.value, callsign: cs.value, from: fr.value, to: to.value, date: dt.value, startAt: new Date(y, m - 1, d).getTime() }); close(); fitted = false; draw(); }
      catch (e) { if (e.message !== '__auth') err.textContent = e.message; ok.disabled = false; }
    };
    const sheet = el('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true' },
      el('h2', {}, '✈️ 내 비행 공유'),
      el('p', { class: 'h' }, '편명을 올리면 회원들이 지도에서 내 비행기를 볼 수 있어요. 위치는 비행기 ADS-B 신호로 받아서, 비행 중에 폰을 켜 둘 필요가 없어요.'),
      el('div', { class: 'row' }, el('div', {}, el('label', {}, '편명'), fl), el('div', {}, el('label', {}, '날짜'), dt)),
      el('label', {}, 'ATC 콜사인 (편명과 다를 때만)'), cs,
      el('div', { class: 'sub' }, '지역 항공사로 운항하면 콜사인이 달라요. 예: UA5432를 SkyWest가 운항하면 SKW5432'),
      el('div', { class: 'row' }, el('div', {}, el('label', {}, '출발 (선택)'), fr), el('div', {}, el('label', {}, '도착 (선택)'), to)),
      err, el('div', { class: 'bt' }, el('button', { type: 'button', onclick: close }, '취소'), ok));
    ok.addEventListener('click', send);
    [fl, cs, fr, to].forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') send(); }));
    const ov = el('div', { class: 'ov' }, sheet);
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    document.body.append(ov); setTimeout(() => fl.focus(), 50);
  }
  $('share').addEventListener('click', openShare);
  $('fit').addEventListener('click', fitAll);
  load();
  // 30초마다 새로 (화면을 보고 있을 때만)
  setInterval(() => { if (!document.hidden && key && !document.querySelector('.ov')) load(true); }, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && key) load(true); });
})();
</script>
</body>
</html>
