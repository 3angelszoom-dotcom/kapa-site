<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1F45">
<title>Route Weather · KAPA</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --f: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif; --ink: #0B1220; --muted: #64748B; --line: #E2E8F0; --bg: #F4F6FA; --navy: #0B1F45; --blue: #1F5FD6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif; display: flex; flex-direction: column; }
  header { background: var(--navy); color: #fff; padding: calc(10px + env(safe-area-inset-top)) 14px 10px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .brand { font: 800 17px/1 var(--f); letter-spacing: .01em; }
  .brand small { font-weight: 600; color: #8EC5FF; margin-left: 6px; font-size: 12px; }
  .who { font-size: 12px; color: #B8C4D9; }
  .who button { background: none; border: 0; color: #8EC5FF; font: inherit; cursor: pointer; padding: 0 0 0 6px; }
  form { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 6px; align-items: center; margin-top: 10px; }
  input { width: 100%; min-width: 0; padding: 10px 9px; border-radius: 10px; border: 1px solid #2B3F66; background: #13284F; color: #fff; font: 600 15px/1.2 var(--f); text-transform: uppercase; }
  input::placeholder { color: #6F82A6; text-transform: none; font-weight: 500; }
  .arrow { color: #6F82A6; font-size: 13px; }
  #rte { grid-column: 1 / -1; width: 100%; min-height: 44px; resize: vertical; padding: 9px; border-radius: 10px; border: 1px solid #2B3F66; background: #13284F; color: #fff; font: 600 13px/1.4 ui-monospace, Menlo, monospace; text-transform: uppercase; }
  #rte::placeholder { color: #6F82A6; text-transform: none; font: 500 12.5px/1.4 var(--f); }
  .skip { margin: 4px 0 0; font: 600 12px/1.4 var(--f); color: #FCD34D; }
  .btns { grid-column: 1 / -1; display: flex; gap: 6px; }
  .btns .go { flex: 1 1 auto; }
  .clr { flex: 0 0 auto; padding: 7px 16px; border: 1px solid #3A5384; border-radius: 10px; background: transparent; color: #C9D6EE; font: 700 13px/1 var(--f); cursor: pointer; }
  .go { grid-column: 1 / -1; padding: 7px 14px; border: 0; border-radius: 10px; background: #fff; color: var(--navy); font: 800 13px/1 var(--f); cursor: pointer; }
  .msg { margin: 8px 0 0; font: 600 13px/1.4 var(--f); color: #D6E2F5; min-height: 1.4em; }
  .msg.err { color: #FCA5A5; }
  .bar { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; padding: 8px 12px; background: #fff; border-bottom: 1px solid var(--line); }
  .tg { flex: 1 1 auto; white-space: nowrap; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 7px; font: 700 12px/1 var(--f); color: var(--muted); cursor: pointer; }
  .tg.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  .embedded #who { visibility: hidden; }
  .bm { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; padding: 2px 12px 8px; background: #fff; border-bottom: 1px solid var(--line); }
  .bar:has(+ .bm) { border-bottom: 0; }
  .bm-l { font: 800 11px/1 var(--f); letter-spacing: .06em; color: var(--muted); text-transform: uppercase; margin-right: 2px; }
  .bm-b { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 10px; font: 700 12px/1 var(--f); color: var(--muted); cursor: pointer; }
  .bm-b[aria-pressed="true"] { background: #0B1F45; border-color: #0B1F45; color: #fff; }
  .bm-hint { font: 600 11px/1.3 var(--f); color: var(--muted); }
  /* 공항 글자: 지도 위 작은 회색 글씨 (흰 테두리로 레이더 위에서도 읽히게) */
  .leaflet-tooltip.ap-lbl { background: none; border: 0; box-shadow: none; padding: 0; font: 800 10.5px/1 var(--f); color: #1E293B; letter-spacing: .02em;
    text-shadow: 0 0 2px #fff, 0 0 2px #fff, 0 0 3px #fff; }
  .leaflet-tooltip.ap-lbl::before { display: none; }
  .legend { display: flex; flex-basis: 100%; justify-content: flex-end; gap: 8px; font: 700 11px/1 var(--f); color: var(--muted); }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 3px; vertical-align: -1px; }
  #map { flex: 1 1 auto; min-height: 52vh; background: #DDE3EA; z-index: 0; position: relative; }
  /* 내 위치 */
  /* 내 위치 버튼: +/− 아래 둥근 반투명 버튼 + 흰 화살표 (켜지면 파란 화살표) */
  .me-ctl { margin-top: 10px !important; }
  .me-ctl .me-loc { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
    background: rgba(22,33,43,.45); color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.2); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .me-ctl .me-loc[aria-pressed="true"] { color: #60A5FA; }
  .me-ctl .me-loc[aria-pressed="true"] path { fill: currentColor; }
  .rf-ctl { margin: 0 12px 12px 0 !important; }
  .me-ctl .rf.spin svg { animation: rf-spin .9s ease-in-out; }
  @keyframes rf-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .me-ctl .rf.spin svg { animation: none; } }
  .me-ctl .me-loc:focus-visible { outline: 2px solid #93C5FD; outline-offset: 2px; }
  .me-dot { position: relative; }
  .me-dot-c { position: absolute; left: 4px; top: 4px; width: 14px; height: 14px; border-radius: 50%; background: #2563EB; border: 2px solid #fff; box-shadow: 0 0 0 2px rgba(37,99,235,.35), 0 1px 4px rgba(0,0,0,.35); box-sizing: border-box; }
  .me-dot-h { position: absolute; left: 0; top: 0; width: 22px; height: 22px; }
  .me-dot-h::before { content: ''; position: absolute; left: 7px; top: -7px; border-left: 4px solid transparent; border-right: 4px solid transparent; border-bottom: 9px solid #2563EB; }
  .me-info { position: absolute; left: 10px; bottom: 26px; z-index: 500; max-width: calc(100% - 20px); padding: 6px 10px; border-radius: 10px; background: rgba(11,31,69,.9); color: #fff;
    font: 700 12.5px/1.35 var(--f); font-variant-numeric: tabular-nums; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  .panel { background: #fff; border-top: 1px solid var(--line); max-height: 34vh; overflow: auto; padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); }
  .panel h2 { font: 800 15px/1.3 var(--f); margin: 0 0 8px; }
  .panel h2 small { font-size: 12px; color: var(--muted); font-weight: 600; }
  .row { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 8px; align-items: center; width: 100%; padding: 8px 10px; margin-bottom: 6px; border: 1px solid var(--line); border-radius: 12px; background: #fff; text-align: left; font: 500 13px/1.35 var(--f); color: #475569; cursor: pointer; }
  .row b { color: var(--ink); }
  .sev { color: #fff; font: 800 10.5px/1 var(--f); letter-spacing: .05em; padding: 4px 7px; border-radius: 999px; }
  .d { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note { font-size: 9.5px; color: #94A3B8; margin: 6px 0 0; line-height: 1.4; }
  .note a { color: inherit; }
  .leaflet-control-attribution { display: none !important; }
  /* 아이폰 Safari 지도 조각 사이 가는 줄: 지도 높이가 소수점 픽셀이면 생김 → 스크립트로 높이를 정수 픽셀로 맞춤. 위성일 땐 바탕을 어둡게 */
  #map.sat { background: #1B2A3A; }
  /* 그래도 남는 가로 줄: Leaflet 기본 '색 더하기(plus-lighter)'를 끄고 바탕·위성 조각만 1px 겹침 (더하지 않으니 겹친 곳이 밝아지지 않음). 레이더는 제외 */
  .nseam img.leaflet-tile { mix-blend-mode: normal !important; width: 257px !important; height: 257px !important; }
  .muted { color: var(--muted); font-size: 13px; margin: 0; }
  .ap { font: 800 12px/1 var(--f); }
  .leaflet-control-attribution { font-size: 9px !important; line-height: 1.3 !important; background: rgba(255,255,255,.6) !important; color: #64748B !important; max-width: 70%; }
  .leaflet-control-attribution a { color: #64748B !important; }
  .login { padding: 16px; max-width: 420px; margin: 24px auto; background: #fff; border: 1px solid var(--line); border-radius: 16px; }
  .login h2 { margin: 0 0 6px; font-size: 17px; }
  .login input { background: #fff; color: var(--ink); border-color: var(--line); margin: 10px 0; text-transform: none; }
  .login button { width: 100%; padding: 12px; border: 0; border-radius: 10px; background: var(--navy); color: #fff; font: 800 15px/1 var(--f); cursor: pointer; }
  .login .msg { color: #B91C1C; }
  /* ===== Route Plan (beta: 테스트 앱에서 열 때) ===== */
  html.beta, html.beta body { height: auto; min-height: 100%; }
  html.beta .panel { max-height: none; overflow: visible; padding-top: 12px; }
  .opt { grid-column: 1 / -1; display: flex; gap: 6px; }
  .opt label { display: flex; align-items: center; gap: 5px; flex: 1 1 0; min-width: 0; font: 800 10.5px/1 var(--f); color: #8FA3C7; letter-spacing: .05em; }
  .opt input { padding: 7px 6px; font-size: 14px; text-align: center; }
  .card { border: 1px solid var(--line); border-radius: 14px; background: #fff; padding: 10px 12px; margin: 0 0 10px; }
  .card h3 { margin: 0 0 8px; font: 800 11.5px/1.2 var(--f); letter-spacing: .06em; color: var(--muted); text-transform: uppercase; display: flex; justify-content: space-between; gap: 8px; }
  .card h3 small { font-weight: 600; letter-spacing: 0; text-transform: none; }
  .sum { display: flex; flex-wrap: wrap; gap: 6px; }
  .sum span { padding: 5px 9px; border-radius: 999px; background: #F1F5F9; font: 700 12px/1.25 var(--f); color: #334155; font-variant-numeric: tabular-nums; }
  .sum .h-TURB { background: #FFEDD5; color: #9A3412; } .sum .h-ICE { background: #E0F2FE; color: #075985; } .sum .h-CONV { background: #FEE2E2; color: #991B1B; }
  .sum .h-IFR { background: #F3E8FF; color: #6B21A8; } .sum .h-ASH, .sum .h-TC { background: #EDE9FE; color: #5B21B6; } .sum .h-ok { background: #DCFCE7; color: #166534; }
  .sum .tail { color: #15803D; } .sum .head { color: #B91C1C; }
  #xs svg { display: block; width: 100%; height: auto; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  #xs svg text { font-family: var(--f); }
  .xs-info { font: 600 12px/1.45 var(--f); color: #334155; min-height: 2.9em; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .xs-info b { color: var(--ink); }
  .xs-leg { display: flex; flex-wrap: wrap; gap: 6px 10px; font: 700 10.5px/1 var(--f); color: var(--muted); margin-top: 4px; }
  .xs-leg i { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 4px; vertical-align: -2px; }
  .xs-note { font: 500 10.5px/1.4 var(--f); color: #94A3B8; margin: 6px 0 0; }
  .apt { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
  @media (min-width: 700px) { .apt { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
  .apt-h { display: flex; align-items: center; gap: 6px; font: 800 15px/1.2 var(--f); }
  .apt-h small { font: 800 10px/1 var(--f); color: var(--muted); letter-spacing: .08em; }
  .cat { font: 800 10.5px/1 var(--f); padding: 3px 6px; border-radius: 6px; background: #F1F5F9; color: #475569; }
  .cat.VFR { background: #DCFCE7; color: #166534; } .cat.MVFR { background: #DBEAFE; color: #1E40AF; } .cat.IFR { background: #FEE2E2; color: #B91C1C; } .cat.LIFR { background: #FAE8FF; color: #86198F; }
  .raw { font: 500 11.5px/1.45 ui-monospace, Menlo, monospace; color: #475569; margin: 5px 0 2px; word-break: break-word; }
  .taf { display: grid; gap: 2px; margin-top: 6px; }
  .taf-r { display: grid; grid-template-columns: 66px 42px minmax(0, 1fr); gap: 6px; align-items: center; padding: 4px 6px; border-radius: 8px; font: 600 12px/1.35 var(--f); color: #334155; }
  .taf-r.now { background: #FEF9C3; box-shadow: inset 3px 0 0 #EAB308; }
  .taf-r .tt { font: 700 11px/1.2 var(--f); color: #64748B; font-variant-numeric: tabular-nums; }
  .taf-r .tt em { display: block; font-style: normal; font-size: 9.5px; letter-spacing: .05em; color: #94A3B8; }
  .taf-r .tx { word-break: break-word; }
  .taf-r .mk { font: 800 10px/1 var(--f); color: #A16207; margin-left: 4px; white-space: nowrap; }
  .taf-src { margin-top: 4px; }
  .taf-src summary { font: 700 11px/1.4 var(--f); color: var(--muted); cursor: pointer; }
  .ic-pirep { width: 14px; height: 14px; }
  /* 지금 Zulu 시각 (테스트 화면): 제목 옆 초록 알약, 점이 깜빡임 */
  .zclk { display: inline-flex; align-items: center; gap: 5px; margin-left: 8px; padding: 4px 8px; border-radius: 999px; vertical-align: 2px;
    background: rgba(16,185,129,.16); border: 1px solid rgba(110,231,183,.4); color: #6EE7B7; font: 800 12px/1 var(--f); letter-spacing: .02em; font-variant-numeric: tabular-nums; }
  .zclk::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #34D399; animation: zclk-b 2s ease-in-out infinite; }
  .zclk[hidden] { display: none; }
  @keyframes zclk-b { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .zclk::before { animation: none; } }
  /* 테스트 화면: 레이어 메뉴 (위 버튼 줄 대신) */
  html.beta .bar, html.beta .bm { display: none; }
  .ly-ctl { position: relative; margin: 10px 10px 0 0 !important; }
  html.beta .leaflet-top { z-index: 1001; }
  .me-ctl .ly-btn.on { background: rgba(11,31,69,.85); }
  .ly-pop { position: absolute; right: 0; top: 48px; width: 236px; max-height: calc(var(--mapH, 60vh) - 70px); overflow: auto; -webkit-overflow-scrolling: touch;
    background: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(11,18,32,.25), 0 1px 3px rgba(11,18,32,.12); padding: 10px 12px 12px; font-family: var(--f); cursor: default; }
  .ly-pop[hidden] { display: none; }
  .ly-h { font: 800 10.5px/1 var(--f); letter-spacing: .08em; color: var(--muted); text-transform: uppercase; margin: 4px 2px 8px; }
  .ly-h + .ly-tiles { margin-bottom: 10px; }
  .ly-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ly-tile { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 6px; border: 2px solid transparent; border-radius: 12px; background: #F8FAFC; font: 700 12px/1 var(--f); color: #334155; cursor: pointer; }
  .ly-tile[aria-pressed="true"] { border-color: var(--blue); color: var(--blue); background: #EFF6FF; }
  .ly-thumb { width: 100%; height: 30px; border-radius: 8px; background: #DDE3EA linear-gradient(135deg, #E9EDF2 0 40%, #D5DCE5 40% 60%, #E9EDF2 60%); }
  .ly-sat .ly-thumb { background: linear-gradient(135deg, #2E5A3A, #6B7F4B 45%, #A68A5B 70%, #1F3B5A); }
  .ly-rows { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .ly-tg { display: flex; align-items: center; gap: 6px; padding: 8px 9px; border: 1.5px solid #E2E8F0; border-radius: 10px; background: #fff; font: 700 12.5px/1 var(--f); color: #64748B; cursor: pointer; text-align: left; }
  .ly-tg[aria-pressed="true"] { border-color: var(--blue); background: #EFF6FF; color: var(--navy); }
  .ly-tg .ly-ic { font-size: 14px; filter: grayscale(1); opacity: .55; }
  .ly-tg[aria-pressed="true"] .ly-ic { filter: none; opacity: 1; }
  .ly-leg { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 1px solid #F1F5F9; font: 700 10.5px/1 var(--f); color: var(--muted); }
  .ly-leg i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 3px; vertical-align: -1px; }
  .ly-leg i.tri { width: 0; height: 0; border-radius: 0; border-left: 5px solid transparent; border-right: 5px solid transparent; border-bottom: 9px solid #0EA5E9; }
  @media (max-width: 480px) {
    form { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); }
    .go { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<header>
  <div class="top"><div class="brand">🗺 Route Weather<small>KAPA</small><span class="zclk" id="zclk" hidden></span></div><div class="who" id="who"></div></div>
  <form id="f" autocomplete="off">
    <input id="from" placeholder="From" maxlength="4" autocapitalize="characters" aria-label="출발 공항">
    <span class="arrow" aria-hidden="true">→</span>
    <input id="to" placeholder="To" maxlength="4" autocapitalize="characters" aria-label="도착 공항">
    <textarea id="rte" rows="2" placeholder="Paste route from release (optional) — e.g. KLAX SUMMR2 SUMMR DCT AVE J88 ... BDEGA4 KSFO" spellcheck="false" autocapitalize="characters" aria-label="릴리스 루트"></textarea>
    <div class="btns"><button class="go" type="submit">Show</button><button class="clr" type="button" id="clr">Clear</button></div>
  </form>
  <p class="msg" id="msg"></p>
  <p class="skip" id="skip" hidden></p>
</header>
<div class="bar" id="bar"></div>
<div id="map"></div>
<div class="panel">
  <p class="note" id="credits"></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function () {
  'use strict';
  // KAPA 테스트 서버 (getRouteWx: 터뷸런스). 로그인은 사이트와 같은 저장소(pc_key)를 씀
  const API_URL = 'https://script.google.com/macros/s/AKfycbxM8aE3mSczAAv6SxyngKNPxyeY7q0Mw4QF1-F-GGvnxpNXEpURJsOaolXf7S1DHuU/exec';
  const store = { get(k) { try { return localStorage.getItem(k) || ''; } catch (_) { return ''; } }, set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (_) {} } };
  let key = store.get('pc_key');
  // 새 기능 미리 보기: 테스트 앱에서 열면 주소에 ?beta=1 (라이브 회원 화면은 그대로)
  const BETA = /[?&]beta=1(&|$)/.test(location.search);
  if (BETA) document.documentElement.classList.add('beta');
  if (BETA) (function tick() {   // 제목 옆 지금 Zulu 시각 (DDHHMMZ, 20초마다)
    const z = document.getElementById('zclk'); if (!z) return;
    const d = new Date(), p = n => String(n).padStart(2, '0');
    z.hidden = false; z.textContent = p(d.getUTCDate()) + p(d.getUTCHours()) + p(d.getUTCMinutes()) + 'Z';
    setTimeout(tick, 20000 - d.getTime() % 20000 + 50);
  })();
  const $ = id => document.getElementById(id);
  const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function el(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => { if (k === 'onclick') e.addEventListener('click', v); else if (k === 'style') e.setAttribute('style', v); else if (v != null) e.setAttribute(k, v); });
    kids.flat().forEach(c => { if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c))); });
    return e;
  }
  // 구글 쪽 연결이 가끔 통째로 멈춤 → 터뷸런스 요청은 12초 넘게 답이 없으면 버리고 다시 보냄 (최대 3번). 입장은 한 번만, 25초
  function call(fn, ...args) {
    const READ = fn === 'getRouteWx' || fn === 'getRoutePlan', LIMIT = fn === 'getRoutePlan' ? 20000 : READ ? 12000 : 25000;
    const once = () => {
      const ac = typeof AbortController === 'function' ? new AbortController() : null;
      const t = ac ? setTimeout(() => ac.abort(), LIMIT) : 0;

        if (s.L) { const cl = s.L.map((l, j) => l.cc >= 50 ? j : -1).filter(j => j >= 0); if (cl.length) a2.push('Cloud ' + (cl[0] === 0 ? 'SFC' : 'FL' + z2(Math.round(LVF[cl[0]] / 1000)) + '0') + '–FL' + z2(Math.round(LVF[cl[cl.length - 1]] / 1000)) + '0'); }
        hazRuns().filter(r => r.a <= k && k <= r.b).forEach(r => a2.push((HZ[r.z.h] || {}).t + ' ' + r.z.k + (altTxt(r.z) ? ' ' + altTxt(r.z) : '')));
        ui.info.replaceChildren(...a1, el('br'), a2.join(' · ') || '—');
      }
    }
    // ---- 출발·도착 METAR / TAF (ETD·ETA 시간대를 노란색으로) ----
    function drawApt() {
      const wx = st.wx; if (!wx) return;
      const one = (ap, when, tag) => {
        if (!ap) return null;
        const m = ap.metar || {}, T = ap.taf, t = when / 1000;
        const kids = [el('div', { class: 'apt-h' }, el('small', {}, tag), ap.icao, m.cat ? el('span', { class: 'cat ' + m.cat }, m.cat) : null, el('small', { style: 'margin-left:auto;letter-spacing:0' }, (tag === 'DEP' ? 'ETD ' : 'ETA ') + zt(when))),
          el('p', { class: 'raw' }, m.raw || 'No METAR')];
        if (!T || !T.f || !T.f.length) kids.push(el('p', { class: 'muted', style: 'font-size:12px' }, 'No TAF'));
        else {
          const rows = T.f.map(f => {
            const hit = f.t0 <= t && t < f.t1, ch = f.ch === 'PROB' ? 'PROB' + (f.p || '') : f.ch || 'BASE';
            const span = (f.ch === 'TEMPO' || f.ch === 'PROB' || f.ch === 'BECMG') ? '–' + z2(new Date(f.t1 * 1000).getUTCHours()) + 'Z' : '';
            return el('div', { class: 'taf-r' + (hit ? ' now' : '') }, el('span', { class: 'tt' }, el('em', {}, ch), zh(f.t0).replace(/00Z$/, 'Z') + span),
              f.cat ? el('span', { class: 'cat ' + f.cat }, f.cat) : el('span', {}),
              el('span', { class: 'tx' }, [f.wind, f.vis, f.wx, f.sky, f.ws].filter(Boolean).join(' ') || '—', hit ? el('span', { class: 'mk' }, '◀ ' + (tag === 'DEP' ? 'ETD' : 'ETA')) : null));
          });
          if (t < T.from || t >= T.to) rows.push(el('p', { class: 'muted', style: 'font-size:11.5px;margin-top:2px' }, (tag === 'DEP' ? 'ETD' : 'ETA') + ' is outside this TAF (valid ' + zh(T.from) + '–' + zh(T.to) + ')'));
          kids.push(el('div', { class: 'taf' }, rows), el('details', { class: 'taf-src' }, el('summary', {}, 'Raw TAF'), el('p', { class: 'raw' }, T.raw)));
        }
        return el('div', {}, kids);
      };
      ui.apt.replaceChildren(...[one(wx.a, st.o.etd, 'DEP'), one(wx.b, st.eta || st.o.etd, 'ARR')].filter(Boolean));
    }
    return { addInputs, build, run, clear };
  })();
  if (BETA) { RP.addInputs(); RP.build(); }

  async function show(f, a, b, rt) {
    if (!key) return showLogin();
    rt = (rt || '').trim();
    if (rt && !(a && b)) {   // 루트 맨 앞·뒤의 공항 코드로 출발·도착을 채움
      const w = rt.toUpperCase().split(/\s+/).map(x => x.replace(/\/.*$/, '')).filter(x => /^[A-Z]{4}$/.test(x) && !/\d/.test(x));
      if (w.length >= 2) { a = a || w[0]; b = b || w[w.length - 1]; $('from').value = a; $('to').value = b; }
    }
    if (!(a && b)) return msg('출발·도착 공항을 넣거나 릴리스 루트를 붙여 넣어 주세요.', true);
    $('skip').hidden = true;
    msg('불러오는 중…');
    let from, to, label;
    try {
      const aps = await loadAirports();
      const find = c => { const k = ICAO3[c] || c.replace(/^K(?=[A-Z]{3}$)/, ''); const x = aps.find(p => p[0] === k); return x ? { code: x[0], lat: x[1], lon: x[2] } : null; };
      from = find(a); to = find(b);
      if (!from || !to) throw new Error('공항 코드를 찾지 못했어요: ' + [!from ? a : '', !to ? b : ''].filter(Boolean).join(', '));
      label = from.code + ' → ' + to.code;
    } catch (e) { if (e.message !== '__auth') msg(e.message, true); return; }
    let gc = gcPoints([from.lat, from.lon], [to.lat, to.lon], 96), filed = null;
    if (rt) {
      try {
        filed = await parseRoute(rt, from, to);
        if (filed.pts.length >= 2) gc = pathOf(filed.pts);
        if (filed.skipped.length) { $('skip').textContent = 'Skipped (not found): ' + filed.skipped.join(' '); $('skip').hidden = false; }
      } catch (e) { msg(e.message, true); }
    }
    layers.route.clearLayers();
    L.polyline(gc.pts, filed ? { color: '#1F5FD6', weight: 3 } : { color: '#1F5FD6', weight: 3, dashArray: '6 6' }).addTo(layers.route);
    if (filed) filed.pts.slice(1, -1).forEach(p => L.circleMarker([p.ll[0], near(p.ll[1], gc.pts[0][1])], { radius: 3, color: '#1F5FD6', weight: 1, fillColor: '#fff', fillOpacity: 1 })
      .bindTooltip(p.name, { direction: 'top', className: 'ap' }).addTo(layers.route));
    [[from, gc.pts[0]], [to, gc.pts[gc.pts.length - 1]]].forEach(([p, ll]) => L.circleMarker(ll, { radius: 6, color: '#0B1220', weight: 2, fillColor: '#fff', fillOpacity: 1 })
      .bindTooltip(p.code, { permanent: true, direction: 'top', className: 'ap' }).addTo(layers.route));
    map.invalidateSize();
    map.fitBounds(L.latLngBounds(gc.pts), { padding: [28, 28] });
    msg(label + ' · ' + Math.round(gc.nm).toLocaleString('en-US') + ' nm');
    const lats = gc.pts.map(p => p[0]), lons = gc.pts.map(p => p[1]);
    const norm = x => ((x + 540) % 360) - 180;
    const box = [Math.max(-90, Math.min(...lats) - 5), norm(Math.min(...lons) - 8), Math.min(90, Math.max(...lats) + 5), norm(Math.max(...lons) + 8)];
    if (BETA) return RP.run({ gc, from, to, filed, label, box, a, b });
    let wx;
    try { wx = await call('getRouteWx', key, box); } catch (e) {
      if (e.message === '__auth') return;
      // 실패 이유를 짧게 보여주고, 지도에 남은 구역·PIREP은 지난번 정보라고 알려 줌
      const old = layers.area.getLayers().length || layers.pirep.getLayers().length;
      msg(label + ' · 터뷸런스 정보를 못 받았어요 (' + String(e.message || '오류').slice(0, 60) + ')' + (old ? ' · 지도는 지난번 정보' : ''), true);
      return;
    }
    const mid = gc.pts[Math.floor(gc.pts.length / 2)][1];
    layers.area.clearLayers(); layers.pirep.clearLayers();
    wx.areas.forEach(z => {
      const col = z.k === 'G-AIRMET' ? '#F97316' : '#DC2626';
      L.polygon(z.c.map(p => [p[0], near(p[1], mid)]), { color: col, weight: 1.5, fillColor: col, fillOpacity: .12, dashArray: z.k === 'G-AIRMET' ? '4 4' : null })
        .bindPopup('<b>' + esc(z.k) + ' · TURB</b>' + (z.lo || z.hi ? '<br>FL' + Math.round(z.lo / 100) + '–FL' + Math.round(z.hi / 100) : '') + (z.fir ? '<br>' + esc(z.fir) : '') + '<br><small>' + esc(z.raw) + '</small>').addTo(layers.area);
    });
    const ago = t => { const m = Math.max(0, Math.round((Date.now() / 1000 - t) / 60)); return m < 60 ? m + ' min ago' : Math.floor(m / 60) + 'h ' + (m % 60) + 'm ago'; };
    const rows = wx.pireps.map(p => {
      const ll = [p[0], near(p[1], mid)];
      let dmin = Infinity, at = 0; gc.pts.forEach((q, i) => { const d = nmBetween(ll, q); if (d < dmin) { dmin = d; at = i; } });
      return { p, ll, d: dmin, along: Math.round(gc.nm * at / (gc.pts.length - 1)) };
    });
    rows.forEach(({ p, ll }) => L.circleMarker(ll, { radius: p[3] >= 3 ? 7 : 5, color: '#fff', weight: 1, fillColor: TCOL[p[3]], fillOpacity: .95 })
      .bindPopup('<b>' + TURB[p[3]] + ' turbulence</b><br>FL' + String(p[2]).padStart(3, '0') + ' · ' + esc(p[4] || '?') + ' · ' + ago(p[5]) + '<br><small>' + esc(p[6]) + '</small>').addTo(layers.pirep));
  }

  function start() {
    $('who').replaceChildren('입장됨', el('button', { type: 'button', onclick: () => { store.set('pc_key', ''); key = ''; showLogin(); } }, '나가기'));
    const parts = decodeURIComponent(location.hash.slice(1)).split('_').filter(Boolean);
    let f = '', a = '', b = '';
    parts.forEach(x => { x = x.toUpperCase().replace(/[^A-Z0-9]/g, ''); if (/\d/.test(x)) return; if (!a) a = x; else b = x; });
    // 새로고침이면 방금 보던 루트(붙여 넣은 릴리스 루트 포함)를 그대로 다시 보여줌. 새로 열면 빈 칸
    let rt = '';
    try {
      const nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
      const cur = JSON.parse(sessionStorage.getItem('rt_cur') || 'null');
      if (nav && nav.type === 'reload' && cur && cur.a && cur.b) { a = cur.a; b = cur.b; rt = cur.rt || ''; }
      else sessionStorage.removeItem('rt_cur');
    } catch (_) {}
    $('from').value = a; $('to').value = b; $('rte').value = rt;
    store.set('pc_rt_last', '');   // 예전에 저장된 루트 지우기 — 새로 열면 빈 칸
    if (a && b) show('', a, b, rt);
  }
  // 앱 안 전체 화면으로 열렸을 때: 오른쪽 위 '입장됨 · 나가기' 자리는 앱의 ✕ 버튼이 씀
  try { if (window.top !== window) document.documentElement.classList.add('embedded'); } catch (_) { document.documentElement.classList.add('embedded'); }
  if (key) start(); else showLogin();
})();
</script>
